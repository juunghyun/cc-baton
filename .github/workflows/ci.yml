name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --python 3.12 --group dev python -m pytest tests -q

  # 새 Mac 사용자처럼: README 설치 → 첫 실행 위저드 → HUD → 제거. PATH 는 macOS 기본값만 (Homebrew 도구 없이).
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fresh install end to end
        run: >
          env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/zsh
          LANG=en_US.UTF-8 TERM=xterm-256color REPO="$GITHUB_WORKSPACE"
          /bin/zsh tests/e2e/fresh-install.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 푸시 범위가 아니라 전체 이력을 본다. 범위 검사는 강제 푸시 뒤 없어진 이전 커밋을 찾다 실패한다.
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact -v --exit-code 1 .
