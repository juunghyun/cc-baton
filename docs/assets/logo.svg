<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="cc-baton">
  <!-- 두 계정(파랑·주황) 사이를 바통이 잇는다. HUD 의 기본 그룹 색과 같다. 배경 투명이라 GitHub 라이트·다크 모두에서 보인다. -->
  <defs>
    <linearGradient id="baton" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00AFFF"/>
      <stop offset="1" stop-color="#FF8700"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-24 48 48)">
    <rect x="18" y="38" width="60" height="20" rx="10" fill="url(#baton)"/>
    <rect x="43" y="38" width="10" height="20" fill="#FFFFFF" fill-opacity=".5"/>
  </g>
  <circle cx="18" cy="63" r="13" fill="#00AFFF"/>
  <circle cx="78" cy="33" r="13" fill="#FF8700"/>
</svg>
